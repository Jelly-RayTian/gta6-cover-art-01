<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Cover Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="sun"></span><b>NEON COAST</b><i>Cover Studio</i></div>
  <button id="exportBtn" class="export" type="button">Export PNG</button>
</header>
<main class="app">
  <section class="stage">
    <div class="stage-wrap"><canvas id="cover" aria-label="Cover art preview"></canvas></div>
    <p class="hint" id="hint">Click a panel &middot; drag to reposition &middot; scroll to zoom &middot; double-click to add a photo</p>
  </section>
  <aside class="side">
    <section><h3>Layout</h3><div id="layouts" class="layouts"></div></section>
    <section><h3>Colour grade</h3><div id="grades" class="grades"></div></section>
    <section class="caption">
      <h3>Caption</h3>
      <input id="title" type="text" maxlength="28" placeholder="Title" value="Neon Coast">
      <input id="sub" type="text" maxlength="40" placeholder="Subtitle" value="Summer in the city">
      <div class="row"><div id="colors" class="colors"></div>
        <select id="pos" aria-label="Caption position"><option value="bottom">Bottom</option><option value="center">Middle</option><option value="top">Top</option></select></div>
      <div class="row"><label class="zoom">Spacing <input id="tracking" type="range" min="-2" max="20" step="0.5" value="2"></label>
        <label class="check"><input id="outline" type="checkbox"> Outline</label></div>
    </section>
    <section><h3>Size</h3><div id="sizes" class="seg"></div></section>
    <section class="panel-box">
      <h3>Panel <span id="panelNo">1</span></h3>
      <div class="row">
        <label class="btn" for="file">Upload photo</label>
        <input id="file" type="file" accept="image/*" multiple hidden>
        <button id="sampleBoulevard" class="btn ghost" type="button">Boulevard</button>
        <button id="samplePier" class="btn ghost" type="button">Pier</button>
      </div>
      <label class="zoom">Zoom <input id="zoom" type="range" min="1" max="4" step="0.01" value="1"></label>
      <div class="row"><button id="flip" class="btn ghost" type="button" aria-pressed="false">Flip &#8596;</button>
        <button id="resetCrop" class="btn ghost" type="button">Reset crop</button>
        <button id="useAll" class="btn" type="button">Use in all panels</button></div>
    </section>
  </aside>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
